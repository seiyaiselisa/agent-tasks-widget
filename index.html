<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fujiko</title>
  <link rel="icon" type="image/png" href="image.png">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #041d33;
      --panel: #062b49;
      --panel-strong: #073a63;
      --text: #f8fbff;
      --muted: #b8d5ea;
      --border: #0a5f9f;
      --running: #0497ef;
      --blocked: #ffd21f;
      --done: #0380e4;
      --queued: #e9f4ff;
      --codex: #ffd21f;
      --claude: #ff321f;
      --other-agent: #f8fbff;
      --font-scale: 1;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: transparent;
      color: var(--text);
    }

    .widget {
      width: calc(100vw - 32px);
      margin: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      box-shadow: 0 16px 40px rgb(0 28 58 / 42%);
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }

    .header-left,
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      padding: 6px 10px;
      border-top: 1px solid var(--border);
      background: color-mix(in srgb, var(--panel-strong) 80%, transparent);
    }

    .font-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .font-button {
      position: relative;
      width: 30px;
      height: 26px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel-strong);
      color: var(--text);
      font: inherit;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
    }

    .font-button .glyph {
      font-size: 14px;
      letter-spacing: 0;
    }

    .font-button .op {
      position: absolute;
      right: 4px;
      bottom: 3px;
      font-size: 8px;
      font-weight: 800;
      line-height: 1;
      color: var(--muted);
    }

    .position-button {
      width: 18px;
      height: 18px;
      padding: 0;
      font-size: 9px;
    }

    .font-button:hover {
      background: #0a4f85;
    }

    h1 {
      margin: 0;
      font-size: calc(14px * var(--font-scale));
      font-weight: 650;
      letter-spacing: 0;
    }

    .meta {
      color: var(--muted);
      font-size: calc(11px * var(--font-scale));
      white-space: nowrap;
    }

    .counts {
      display: flex;
      align-items: baseline;
      gap: 4px;
      color: var(--text);
      font-size: calc(12px * var(--font-scale));
      font-weight: 700;
      white-space: nowrap;
    }

    .counts .counts-num {
      font-size: calc(15px * var(--font-scale));
      color: var(--done);
    }

    .counts .counts-total {
      color: var(--muted);
      font-weight: 500;
    }

    .list {
      display: grid;
      gap: 1px;
      background: var(--border);
    }

    .task {
      display: grid;
      gap: 5px;
      padding: 10px 12px;
      border-left: 4px solid var(--other-agent);
      background: var(--panel);
    }

    .task.agent-codex {
      border-left-color: var(--codex);
    }

    .task.agent-claude {
      border-left-color: var(--claude);
    }

    .task-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .title {
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: calc(13px * var(--font-scale));
      font-weight: 650;
      line-height: 1.35;
    }

    .badge {
      flex: 0 0 auto;
      min-width: 72px;
      border-radius: 999px;
      padding: 3px 8px;
      color: #061421;
      font-size: calc(11px * var(--font-scale));
      font-weight: 650;
      text-align: center;
      text-transform: uppercase;
    }

    .running {
      background: var(--running);
      color: white;
    }

    .blocked { background: var(--blocked); }
    .done { background: var(--done); }
    .queued { background: var(--queued); }

    .summary,
    .details {
      margin: 0;
      color: var(--muted);
      font-size: calc(12px * var(--font-scale));
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .details {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .agent-label {
      font-weight: 700;
    }

    .project {
      color: var(--muted);
      font-weight: 600;
    }

    .agent-codex .agent-label {
      color: var(--codex);
    }

    .agent-claude .agent-label {
      color: var(--claude);
    }

    .empty,
    .error {
      padding: 16px 12px;
      background: var(--panel);
      color: var(--muted);
      font-size: calc(12px * var(--font-scale));
      line-height: 1.5;
    }

    .error {
      color: #ffb4a8;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .agent-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .group-header {
      padding: 6px 12px 0;
      font-size: calc(10px * var(--font-scale));
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .group-header.agent-codex { color: var(--codex); }
    .group-header.agent-claude { color: var(--claude); }

    .older {
      margin: 0;
      padding: 0;
    }

    .older > summary {
      list-style: none;
      cursor: pointer;
      padding: 4px 10px;
      color: var(--muted);
      font-size: calc(11px * var(--font-scale));
      user-select: none;
    }

    .older > summary::-webkit-details-marker {
      display: none;
    }

    .older > summary::before {
      content: "▸ ";
    }

    .older[open] > summary::before {
      content: "▾ ";
    }

    .older[open] > summary {
      margin-bottom: 6px;
    }

    .older-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <main class="widget" aria-live="polite">
    <header class="header">
      <div class="header-left">
        <h1>Fujiko</h1>
      </div>
      <div class="header-right">
        <div id="counts" class="counts" aria-label="進捗"></div>
        <div id="meta" class="meta">loading</div>
      </div>
    </header>
    <section id="list" class="list"></section>
    <footer class="footer">
      <div class="font-controls" aria-label="文字サイズ">
        <button id="fontDown" class="font-button" type="button" title="文字を小さくする">
          <span class="glyph">A</span><span class="op">−</span>
        </button>
        <button id="fontUp" class="font-button" type="button" title="文字を大きくする">
          <span class="glyph">A</span><span class="op">+</span>
        </button>
      </div>
    </footer>
  </main>

  <script>
    const yamlPath = new URLSearchParams(location.search).get("src") || "tasks.yaml";
    const refreshMs = Number(new URLSearchParams(location.search).get("refresh") || 3000);
    const list = document.querySelector("#list");
    const meta = document.querySelector("#meta");
    const counts = document.querySelector("#counts");
    const fontDown = document.querySelector("#fontDown");
    const fontUp = document.querySelector("#fontUp");
    const fontScaleKey = "agentTasksFontScale";
    let lastText = "";

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function setFontScale(scale) {
      const next = clamp(Number(scale) || 1, 0.8, 1.5);
      document.documentElement.style.setProperty("--font-scale", String(next));
      localStorage.setItem(fontScaleKey, String(next));
    }

    setFontScale(localStorage.getItem(fontScaleKey) || 1);
    fontDown.addEventListener("click", () => {
      setFontScale(Number(localStorage.getItem(fontScaleKey) || 1) - 0.1);
    });
    fontUp.addEventListener("click", () => {
      setFontScale(Number(localStorage.getItem(fontScaleKey) || 1) + 0.1);
    });

    function parseValue(value) {
      const trimmed = value.trim();
      if ((trimmed.startsWith('"') && trimmed.endsWith('"')) ||
          (trimmed.startsWith("'") && trimmed.endsWith("'"))) {
        return trimmed.slice(1, -1);
      }
      if (trimmed === "true") return true;
      if (trimmed === "false") return false;
      return trimmed;
    }

    function parseTaskYaml(text) {
      const result = { updated: "", tasks: [] };
      let current = null;

      for (const rawLine of text.split(/\r?\n/)) {
        const line = rawLine.replace(/\s+#.*$/, "");
        if (!line.trim() || line.trim() === "tasks:") continue;

        const topLevel = line.match(/^([A-Za-z0-9_-]+):\s*(.*)$/);
        if (topLevel && !line.startsWith(" ")) {
          result[topLevel[1]] = parseValue(topLevel[2]);
          continue;
        }

        const itemStart = line.match(/^\s*-\s+([A-Za-z0-9_-]+):\s*(.*)$/);
        if (itemStart) {
          current = {};
          current[itemStart[1]] = parseValue(itemStart[2]);
          result.tasks.push(current);
          continue;
        }

        const property = line.match(/^\s+([A-Za-z0-9_-]+):\s*(.*)$/);
        if (property && current) {
          current[property[1]] = parseValue(property[2]);
        }
      }

      return result;
    }

    function statusClass(status) {
      const normalized = String(status || "queued").toLowerCase();
      if (["running", "blocked", "done", "queued"].includes(normalized)) return normalized;
      return "queued";
    }

    function agentClass(agent) {
      const normalized = String(agent || "").toLowerCase();
      if (normalized === "codex") return "agent-codex";
      if (normalized === "claude") return "agent-claude";
      return "agent-other";
    }

    function render(data) {
      const tasks = Array.isArray(data.tasks) ? data.tasks : [];
      meta.textContent = data.updated ? `updated ${data.updated}` : new Date().toLocaleTimeString();

      const done = tasks.filter((t) => statusClass(t.status) === "done").length;
      counts.innerHTML = tasks.length
        ? `<span class="counts-num">${done}</span><span class="counts-total">/ ${tasks.length} done</span>`
        : "";

      if (!tasks.length) {
        list.innerHTML = '<div class="empty">tasks.yaml にタスクを追加してください。</div>';
        return;
      }

      const groups = new Map();
      for (const task of tasks) {
        const key = String(task.thread || task.agent || "agent").toLowerCase();
        if (!groups.has(key)) groups.set(key, { label: task.thread || task.agent || "agent", tasks: [] });
        groups.get(key).tasks.push(task);
      }

      list.innerHTML = Array.from(groups.values()).map(({ label, tasks: group }) => {
        const [latest, ...older] = group;
        const olderHtml = older.length
          ? `<details class="older">
               <summary>過去のタスク (${older.length})</summary>
               <div class="older-list">${older.map(renderTask).join("")}</div>
             </details>`
          : "";
        const headerHtml = `<div class="group-header ${agentClass(latest.agent)}">${escapeHtml(label)}</div>`;
        return `<div class="agent-group">${headerHtml}${renderTask(latest)}${olderHtml}</div>`;
      }).join("");
    }

    function renderTask(task) {
      const status = statusClass(task.status);
      const agentCssClass = agentClass(task.agent);
      const title = escapeHtml(task.title || "(untitled)");
      const agent = escapeHtml(task.agent || "agent");
      const summary = escapeHtml(task.summary || "");
      const since = escapeHtml(task.since || "");
      const project = escapeHtml(task.project || "");
      const url = task.url ? String(task.url) : "";
      const titleHtml = url
        ? `<a href="${escapeAttr(url)}" target="_blank" rel="noreferrer">${title}</a>`
        : title;

      return `
        <article class="task ${agentCssClass}">
          <div class="task-top">
            <div class="title">${titleHtml}</div>
            <div class="badge ${status}">${escapeHtml(status)}</div>
          </div>
          ${summary ? `<p class="summary">${summary}</p>` : ""}
          <p class="details"><span class="agent-label">${agent}</span>${project ? `<span class="project">📂 ${project}</span>` : ""}${since ? `<span>since ${since}</span>` : ""}</p>
        </article>
      `;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#96;");
    }

    async function refresh() {
      try {
        const response = await fetch(`${yamlPath}?t=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const text = await response.text();
        if (text !== lastText) {
          lastText = text;
          render(parseTaskYaml(text));
        }
      } catch (error) {
        list.innerHTML = `<div class="error">YAML を読み込めません: ${escapeHtml(error.message)}</div>`;
        meta.textContent = "error";
      }
    }

    refresh();
    setInterval(refresh, refreshMs);
  </script>
</body>
</html>
